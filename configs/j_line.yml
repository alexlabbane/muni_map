# configs/j_line.yml
name: J Line
description: J line from Embarcadero to 30th St
route_id: J

# LED controllers - each is a separate node, can be mock or real
led_controllers:
  mock_j:
    type: mock
    id: mock_j
    num_leds: 24
    mock_led_id: 1

global:
  pulse_threshold: 600
  solid_threshold: 30

# Lines reference controllers by ID
lines:
  j_line:
    name: J Line
    route_id: J
    controller: mock_j  # References the mock_j controller
    stops:
